# Perfil prod: hereda application.properties base y endurece para AWS.
# Las propiedades sensibles llegan como env vars desde SSM Parameter Store
# (definidas en infra/task-definition.json).

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.level.com.yala=INFO
logging.level.org.springframework.security=WARN
