spring.application.name=yala
spring.config.import=optional:file:.env[.properties]

# ==========================================
# SERVER
# ==========================================
server.port=${PORT_NUMBER:8081}

# ==========================================
# BASE DE DATOS (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yala}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:changeme_use_a_real_secret_in_env}
jwt.access-token-expiration-ms=${jwt.expiration-access:3600000}
jwt.refresh-token-expiration-ms=${jwt.expiration-refresh:3600000}

# ==========================================
# AWS S3 (Imágenes)
# ==========================================
aws.access-key-id=${AWS_ACCESS_KEY_ID:dummy-access-key}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:dummy-secret-key}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:yala-bucket-dev}

# ==========================================
# PAGOS (MercadoPago)
# ==========================================
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# ==========================================
# CORREOS (Resend)
# ==========================================
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:notifications@yala.dpdns.org}

# ==========================================
# DIDIT (verificación de identidad DNI)
# ==========================================
didit.api-key=${DIDIT_API_KEY:}
didit.webhook-secret=${DIDIT_WEBHOOK_SECRET:}
# workflow_id: configurable por entorno (DIDIT_WORKFLOW_ID tiene precedencia sobre este default).
didit.workflow-id=${DIDIT_WORKFLOW_ID:458fe249-28d7-4aac-8dbf-c6c302dac434}
didit.callback-url=https://yala.dpdns.org/verify/done

# ==========================================
# JSON.pe (validación de DNI en registro de comprador)
# ==========================================
jsonpe.base-url=${JSONPE_BASE_URL:https://api.json.pe}
jsonpe.api-key=${JSONPE_API_KEY:}

# ==========================================
# OPENAI (resumen IA de comentarios del live)
# ==========================================
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.model=${OPENAI_MODEL:gpt-5-nano}

# ==========================================
# LIVEKIT (transmisiones en vivo)
# ==========================================
livekit.url=${LIVEKIT_URL:}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}

# ==========================================
# APP
# ==========================================
app.base-url=${APP_BASE_URL:http://localhost:8081}
# URL pública de la web (para links en emails y deep-links de lives)
app.web-url=${APP_WEB_URL:http://localhost:5173}

# ==========================================
# LOGGING
# ==========================================
logging.level.com.yala=INFO
logging.level.org.springframework.security=WARN
