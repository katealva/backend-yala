spring.application.name=yala
spring.config.import=optional:file:.env[.properties]

server.port=${PORT_NUMBER:8081}

# ==========================================
# BASE DE DATOS (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yala}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT
# ==========================================
jwt.secret=${jwt.secret:changeme_use_a_real_secret_in_env}
jwt.access-token-expiration-ms=${jwt.expiration-access:3600000}
jwt.refresh-token-expiration-ms=${jwt.expiration-refresh:3600000}

# ==========================================
# AWS S3 (Imágenes)
# ==========================================
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:yala-bucket-dev}



# ==========================================
# PAGOS (Stripe)
# ==========================================
stripe.public-key=${STRIPE_PUBLIC_KEY:}
stripe.secret-key=${STRIPE_SECRET_KEY:}

# ==========================================
# CORREOS (Resend)
# ==========================================
resend.api-key=${RESEND_API_KEY:}

# ==========================================
# LOGGING
# ==========================================
logging.level.com.yala=INFO
logging.level.org.springframework.security=WARN
