# =====================================================================
# Perfil dev — activado con spring.profiles.active=dev (o SPRING_PROFILES_ACTIVE=dev).
# Habilita la ejecución de data-dev.sql al arrancar la app, después de que
# Hibernate haya creado/actualizado el esquema con ddl-auto=update.
#
# En producción (sin perfil dev) estas propiedades NO se aplican, por lo que
# spring.sql.init.mode queda en su default (embedded) y data-dev.sql se ignora.
# =====================================================================

spring.sql.init.mode=always
spring.sql.init.platform=dev
spring.jpa.defer-datasource-initialization=true
