services:
  db:
    image: postgres:16-alpine
    container_name: yala-db
    environment:
      POSTGRES_DB: ${DB_NAME:-yala}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - yala_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-yala}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  yala_pgdata:
