name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPO: yala-backend
      ECS_CLUSTER: yala
      ECS_SERVICE: yala-svc

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPO:${{ github.sha }}
          docker build -t $IMAGE -t $REGISTRY/$ECR_REPO:latest .
          docker push $IMAGE
          docker push $REGISTRY/$ECR_REPO:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Resolve account placeholders in task definition
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s/__ACCOUNT_ID__/$ACCOUNT_ID/g" infra/task-definition.json

      - name: Render task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition.json
          container-name: app
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Update repo homepage with deployed URL
        env:
          GH_TOKEN: ${{ secrets.REPO_HOMEPAGE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::REPO_HOMEPAGE_TOKEN secret no configurado; salto actualizacion del homepage"
            exit 0
          fi
          TASK=$(aws ecs list-tasks --cluster $ECS_CLUSTER --service-name $ECS_SERVICE \
            --region $AWS_REGION --desired-status RUNNING \
            --query 'taskArns[0]' --output text)
          ENI=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK \
            --region $AWS_REGION \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" \
            --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI \
            --region $AWS_REGION \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          URL="http://$IP:8081"
          echo "::notice title=Deployed::App live at $URL"
          gh api -X PATCH /repos/${{ github.repository }} -f homepage="$URL" >/dev/null
