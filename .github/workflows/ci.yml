name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: yala_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          jwt.secret: ci-secret-key-long-enough-for-hs256-min-256-bits-needed
